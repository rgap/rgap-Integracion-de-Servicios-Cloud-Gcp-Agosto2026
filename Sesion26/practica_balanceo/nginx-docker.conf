# Nginx dentro de Docker Compose.
# Es el mismo nginx.conf de la práctica, pero cada servidor se llama
# por su nombre de servicio (tienda1, tienda2, tienda3) en lugar de 127.0.0.1.

worker_processes 1;

events {
    worker_connections 256;
}

http {
    access_log off;

    upstream tienda {
        server tienda1:3001;
        server tienda2:3002;
        server tienda3:3003;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://tienda;
            # Si un contenedor está apagado, Nginx espera 2 s (no 60 s)
            # antes de pasar la solicitud al siguiente servidor.
            proxy_connect_timeout 2s;
        }
    }
}
