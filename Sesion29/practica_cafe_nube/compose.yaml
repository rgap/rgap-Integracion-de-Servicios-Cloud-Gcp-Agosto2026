services:
  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
  api:
    build: ./api
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://cafe:cafe@db:5432/cafe
    depends_on:
      - db
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe
      POSTGRES_DB: cafe
    volumes:
      - datos:/var/lib/postgresql/data

volumes:
  datos:
