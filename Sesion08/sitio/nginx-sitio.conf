# Configuración de nginx para publicar el sitio de Python.
#
# Cópiala sobre el bloque server de /etc/nginx/sites-available/default,
# comprueba con  sudo nginx -t  y aplica con  sudo systemctl reload nginx
#
# nginx atiende en el 80 (abierto en el firewall) y reenvía al 3000, que
# solo escucha en 127.0.0.1 y NO necesita abrirse. A eso se le llama
# proxy inverso: el visitante habla con nginx, nunca con Python.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;

        # Sin estas cabeceras, la aplicación de atrás creería que todas
        # las visitas vienen de la propia máquina.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
