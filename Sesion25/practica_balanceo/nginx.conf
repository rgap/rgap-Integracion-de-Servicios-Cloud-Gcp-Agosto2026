# Nginx como balanceador de la tienda de Pedidos Express.

# Un solo proceso de Nginx, para que los turnos se vean en orden.
worker_processes 1;

# Archivos de Nginx dentro de esta carpeta (no hace falta tocarlos).
pid       nginx.pid;
error_log error.log;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path temp_body;
    proxy_temp_path       temp_proxy;
    fastcgi_temp_path     temp_fastcgi;
    uwsgi_temp_path       temp_uwsgi;
    scgi_temp_path        temp_scgi;

    # El grupo de servidores. Sin indicar otra cosa, Nginx usa round robin:
    # 3001, 3002, 3003, 3001, 3002, 3003...
    upstream tienda {
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
    }

    # La única dirección que conocen los clientes: localhost:8080.
    server {
        listen 8080;

        location / {
            proxy_pass http://tienda;
        }
    }
}
